plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 从 local.properties 读取高德地图 API Key（避免把密钥硬编码进版本库）
def amapApiKey = ""
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    def props = new Properties()
    localPropsFile.withInputStream { props.load(it) }
    amapApiKey = props.getProperty("AMAP_API_KEY", "")
}

android {
    namespace 'com.odyssey.planner'
    compileSdk 34

    defaultConfig {
        applicationId "com.odyssey.planner"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        vectorDrawables {
            useSupportLibrary true
        }

        // 高德地图 API Key 通过占位符注入 AndroidManifest
        manifestPlaceholders = [AMAP_API_KEY: amapApiKey]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // 高德地图 3D SDK（版本号如与高德官网不符，可在此调整）
    implementation 'com.amap.api:3dmap:9.8.2'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Compose BOM 统一管理版本
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
